name: Drift Monitoring

# Runs the Evidently drift check on GitHub's free compute, then publishes the
# HTML report to GitHub Pages (free static hosting) and as a downloadable artifact.
on:
  schedule:
    - cron: "0 6 * * *"     # daily 06:00 UTC == 09:00 EAT
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: read
  pages: write              # deploy to GitHub Pages
  id-token: write           # required by deploy-pages

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      MONITOR_REFERENCE_STATES: "MD"   # training-region proxy (swap for live data later)
      MONITOR_CURRENT_STATES: "DC"     # recent/new data to check for drift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Run drift monitoring
        run: PYTHONPATH=src python -m loan_predictor.monitoring job

      - name: Show verdict in the run summary
        if: always()
        run: |
          echo "### Drift Monitoring Result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/monitoring.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-run-${{ github.run_number }}
          path: reports/monitoring.*

      - name: Prepare Pages site (report becomes the home page)
        run: |
          mkdir -p site
          cp reports/monitoring.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
